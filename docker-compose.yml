# Control plane stack. Providers run workers separately with docker-compose.worker.yml.
services:
  # A single-node replica set: ledger postings commit in multi-document transactions, which need one.
  # Not published on the host; only the API reaches it.
  mongo:
    image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  # Not published on the host, and password-protected: replicas trust Redis messages for tunnel routing.
  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD to a random value}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    # Loopback only: your TLS-terminating proxy on this host forwards to it.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://mongo:27017/?replicaSet=rs0
      - MONGODB_DB=agentmesh
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}
      - ENVIRONMENT=production
      - ALLOW_TEST_CREDITS=false
      # https URL customers and workers use to reach this API (behind your TLS-terminating proxy)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public https URL of the API}
      - FRONTEND_URL=${FRONTEND_URL:?Set FRONTEND_URL to the public URL of the dashboard}
      - CORS_ORIGINS=["${FRONTEND_URL}"]
      # Paystack test key (sk_test_...). Payments stay disabled while unset.
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - BILLING_CURRENCY=${BILLING_CURRENCY:-NGN}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Client addresses (rate limits, audit log, webhook IP checks) come from X-Forwarded-For only when the
      # connection comes from these proxy addresses (IPs or CIDRs), e.g. the compose network gateway your proxy
      # connects from. Never '*': anyone reaching the API directly could then spoof their address.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:?Set FORWARDED_ALLOW_IPS to your TLS proxy address as the API sees it}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
