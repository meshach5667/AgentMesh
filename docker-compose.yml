# Control plane stack. Providers run workers separately with docker-compose.worker.yml.
services:
  # A single-node replica set: ledger postings commit in multi-document transactions, which need one.
  # Not published on the host; only the API reaches it.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://mongo:27017/?replicaSet=rs0
      - MONGODB_DB=agentmesh
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 characters}
      - ENVIRONMENT=production
      - ALLOW_TEST_CREDITS=false
      # https URL customers and workers use to reach this API (behind your TLS-terminating proxy)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public https URL of the API}
      - FRONTEND_URL=${FRONTEND_URL:?Set FRONTEND_URL to the public URL of the dashboard}
      - CORS_ORIGINS=["${FRONTEND_URL}"]
      # Paystack test key (sk_test_...). Payments stay disabled while unset.
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - BILLING_CURRENCY=${BILLING_CURRENCY:-NGN}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    # --proxy-headers: client addresses (rate limits, audit log, webhook IP checks) come from the TLS proxy.
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
