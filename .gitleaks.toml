# Gitleaks config for the Security Scan workflow. Keeps every default rule and allowlists only the
# placeholder keys used by tests and the e2e README; anything else that looks like a key still fails the scan.
[extend]
useDefault = true

[allowlist]
description = "Fake keys and non-secrets in tests and docs"
regexes = [
  '''^sk_test_fake0+$''',
  '''^sk_test_abc123abc123$''',
  '''^sk_live_1234567890abcdef$''',
  # Marker string the log-canary tests (server/tests/test_privacy.py) assert never reaches the logs.
  '''^CANARY-SECRET-e51d0a$''',
  # A type annotation (key: Ed25519PrivateKey | None) in server/tests/test_node_agent/test_phase4.py, not a key.
  '''^Ed25519PrivateKey$''',
]
