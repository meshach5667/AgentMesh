name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install ruff mypy
          
      - name: Run Ruff check
        run: ruff check server/
        
      - name: Run Ruff format check
        run: ruff format --check server/
        
      - name: Run mypy
        run: mypy server/app/ --ignore-missing-imports

  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentmesh
          POSTGRES_USER: agentmesh
          POSTGRES_PASSWORD: agentmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh
        run: cd server && alembic upgrade head
        
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: cd server && pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=60
        
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage.xml

  client-lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: cd client && npm ci
        
      - name: Run lint
        run: cd client && npm run lint
        
      - name: Run build
        run: cd client && npm run build
        
      - name: Type check
        run: cd client && npx tsc --noEmit

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: cd client && npm ci
        
      - name: Run tests
        run: cd client && npm test --if-present

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build server image
        run: docker build -t agentmesh-server -f Dockerfile.server .
        
      - name: Build node agent image
        run: docker build -t agentmesh-node-agent -f Dockerfile.node-agent .
        
      - name: Build client image
        run: docker build -t agentmesh-client -f Dockerfile.client .

  migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentmesh
          POSTGRES_USER: agentmesh
          POSTGRES_PASSWORD: agentmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          
      - name: Check migrations reversibility
        env:
          DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh
        run: |
          cd server
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
