name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  server-lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install ruff mypy
          
      - name: Run Ruff check
        run: ruff check server/
        
      - name: Run Ruff format check
        run: ruff format --check server/
        
      - name: Run mypy
        run: mypy server/app/ --ignore-missing-imports

  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentmesh
          POSTGRES_USER: agentmesh
          POSTGRES_PASSWORD: agentmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh
        run: cd server && alembic upgrade head
        
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh
          TEST_DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: |
          PGPASSWORD=agentmesh psql -h localhost -U agentmesh -d agentmesh -c 'CREATE DATABASE agentmesh_test'
          cd server && pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=60
        
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage.xml

  client-lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: cd client && npm ci
        
      - name: Run lint
        run: cd client && npm run lint
        
      - name: Run build
        run: cd client && npm run build
        
      - name: Type check
        run: cd client && npx tsc --noEmit

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: cd client && npm ci
        
      - name: Run tests
        run: cd client && npm test --if-present

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build server image
        run: docker build -t agentmesh-server -f Dockerfile.server .
        
      - name: Build worker image
        run: docker build -t agentmesh-worker -f Dockerfile.node-agent .

      - name: Worker image smoke test
        run: docker run --rm --entrypoint python agentmesh-worker -m node_agent hardware
        
      - name: Build client image
        run: docker build -t agentmesh-client -f Dockerfile.client .

  migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentmesh
          POSTGRES_USER: agentmesh
          POSTGRES_PASSWORD: agentmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          
      - name: Check migrations reversibility
        env:
          DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh
        run: |
          cd server
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head

  e2e-stub-runtime:
    # Full worker -> control plane -> gateway flow on PostgreSQL with real migrations. The model runtime is a
    # labelled stub (server/tests/fixtures/fake_ollama.py), so this proves the platform path, not inference.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentmesh
          POSTGRES_USER: agentmesh
          POSTGRES_PASSWORD: agentmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@localhost:5432/agentmesh
      ENVIRONMENT: test
      PUBLIC_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: Migrate
        run: cd server && alembic upgrade head
      - name: Start control plane
        run: cd server && (uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../cp.log 2>&1 &) && sleep 5 && curl -sf http://127.0.0.1:8000/health
      - name: End-to-end (stub runtime)
        run: |
          cd server
          python scripts/e2e_ollama.py --api http://127.0.0.1:8000 --mode agent --model smollm2:135m \
            --ollama-binary tests/fixtures/fake_ollama.py
      - name: Control plane log
        if: always()
        run: cat cp.log

  e2e-real-ollama:
    # Real model download and inference on CPU. Manual trigger only: downloads Ollama and a ~270 MB model.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./e2e.db
      ENVIRONMENT: test
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      OLLAMA_VERSION: "0.12.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: Install pinned Ollama
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=$OLLAMA_VERSION sh && sudo systemctl stop ollama || true
      - name: Start control plane
        run: |
          cd server && python scripts/init_dev_db.py
          (uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../cp.log 2>&1 &) && sleep 5
      - name: End-to-end (real Ollama)
        run: cd server && python scripts/e2e_ollama.py --api http://127.0.0.1:8000 --mode agent --model smollm2:135m
      - name: Logs
        if: always()
        run: cat cp.log; cat /tmp/agentmesh-e2e-worker-*/worker.log || true
