services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./server:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development

  node-agent:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./server/node_agent:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
